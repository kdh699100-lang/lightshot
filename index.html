<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lightshot — Captured with Lightshot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  
  #scare {
    position: fixed; inset: 0; background: #fff;
    display: flex; align-items: center; justify-content: center;
    animation: flashBg 0.12s infinite steps(1);
  }
  
  /* 흑백 반전 깜박임 효과 */
  @keyframes flashBg {
    0% { background: #000; filter: invert(0); }
    50% { background: #fff; filter: invert(1); }
    100% { background: #000; filter: invert(0); }
  }

  /* 거대한 눈동자 고정 스타일 */
  .face-box {
    width: 100%; height: 100%;
    background: #050505;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative;
    overflow: hidden;
    animation: shakeFace 0.06s infinite;
  }

  .huge-eye {
    width: 220px; height: 220px;
    background: #fff;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 50px #fff;
    position: absolute;
    top: 15%;
  }

  .pupil {
    width: 90px; height: 90px;
    background: #000;
    border-radius: 50%;
    border: 15px solid #333;
  }

  @keyframes shakeFace {
    0% { transform: translate(4px, -4px) scale(1.02); }
    25% { transform: translate(-6px, 6px) scale(0.98); }
    50% { transform: translate(-4px, -6px) scale(1.04); }
    75% { transform: translate(6px, 4px) scale(0.97); }
    100% { transform: translate(4px, -4px) scale(1.02); }
  }
</style>
</head>
<body onclick="startChaos()" ontouchstart="startChaos()">

  <div id="scare">
    <div class="face-box">
      <div class="huge-eye">
        <div class="pupil"></div>
      </div>
    </div>
  </div>

<script>
let started = false;
function startChaos() {
  if (started) return;
  started = true;
  if (navigator.vibrate) navigator.vibrate([300, 50, 300, 50, 500, 100, 800]);
  
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    
    // 기괴한 음성/노이즈 루프 생성 (아아강가일가락 느낌의 불협화음)
    function creepySound() {
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      
      osc.type = 'sawtooth';
      // 주파수를 미쳐 날뛰게 설정하여 기괴한 소리 유발
      const freq = 150 + Math.random() * 1200;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(freq + (Math.random() * 2000 - 1000), ctx.currentTime + 0.3);
      
      gain.gain.setValueAtTime(0.4, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.35);
      
      osc.connect(gain);
      gain.connect(ctx.destination);
      
      osc.start();
      osc.stop(ctx.currentTime + 0.35);
    }

    // 0.2초마다 소리가 불규칙하게 반복되도록 설정
    setInterval(creepySound, 200);
  } catch (e) {}
}

// 자동 재생 시도
window.onload = function() {
  setTimeout(startChaos, 100);
};
</script>
</body>
</html>
