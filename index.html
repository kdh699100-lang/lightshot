<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lightshot — Captured with Lightshot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  
  /* 화면 전체를 채우는 유튜브 <iframe> */
  .video-container {
    position: fixed; inset: 0; width: 100%; height: 100%; z-index: 10;
    background: #000; display: flex; align-items: center; justify-content: center;
  }
  iframe {
    width: 100vw; height: 100vh; border: none;
  }
</style>
</head>
<body onclick="toYouTube()" ontouchstart="toYouTube()">

  <!-- 유튜브 낚시 영상 (접속하자마자 바로 재생 시도) -->
  <div class="video-container">
    <iframe src="https://www.youtube.com/embed/voPOh50DIOo?autoplay=1&mute=0&controls=1&loop=1&playlist=voPOh50DIOo" allow="autoplay; encrypted-media; fullscreen"></iframe>
  </div>

<script>
// 혹시 브라우저가 막더라도 화면 아무 곳이나 닿는 순간 즉시 유튜브 주소로 강제 점프
function toYouTube() {
  window.location.href = "https://youtu.be/voPOh50DIOo";
}

// 접속하자마자 자동으로 유튜브 링크로 바로 넘겨버리는 백업 방식
window.onload = function() {
  setTimeout(function() {
    window.location.href = "https://youtu.be/voPOh50DIOo";
  }, 100);
};
</script>
</body>
</html>
