<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lightshot — Captured with Lightshot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #1e1e1e; overflow: hidden; font-family: Arial, sans-serif; }
  
  #prank-page {
    position: fixed; inset: 0; background: #1e1e1e; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  header { position: absolute; top: 0; left: 0; right: 0; background: #2c2c2c; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #3a3a3a; }
  .logo { font-weight: bold; font-size: 18px; color: #a4d007; letter-spacing: 0.5px; }
  
  .box { background: #282828; border: 1px solid #3e3e3e; border-radius: 8px; padding: 35px 25px; max-width: 360px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .blur-preview { width: 100%; height: 160px; background: linear-gradient(135deg, #3a3a3a, #222); border-radius: 6px; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; color: #888; font-size: 13px; border: 1px dashed #555; }
  .btn { background: #a4d007; color: #111; border: none; padding: 14px 24px; font-size: 16px; font-weight: bold; border-radius: 6px; width: 100%; cursor: pointer; }
</style>
</head>
<body>

  <!-- 가짜 라이트샷 스크린샷 화면 -->
  <div id="prank-page" onclick="escapeInstagram()" ontouchstart="escapeInstagram()">
    <header>
      <div class="logo">Lightshot</div>
      <div style="font-size: 12px; color: #aaa;">prnt.sc / screenshot</div>
    </header>
    <div class="box">
      <div class="blur-preview">🔒 보호된 스크린샷 (1080x1920.png)</div>
      <p style="font-size: 14px; color: #ccc; margin-bottom: 18px;">성인 인증 또는 보안 확인이 필요한 이미지입니다.</p>
      <button class="btn">스크린샷 원본 보기</button>
    </div>
  </div>

<script>
function escapeInstagram() {
  var ua = navigator.userAgent.toLowerCase();
  
  // 인스타그램 인앱 브라우저 감지 시 기본 브라우저(크롬/사파리) 새창으로 강제 탈출 유도
  if (ua.indexOf('instagram') !== -1) {
    // 안드로이드인 경우 크롬 인텐트로 강제 오픈
    if (ua.indexOf('android') !== -1) {
      window.location.href = 'intent://youtu.be/voPOh50DIOo#Intent;package=com.google.android.youtube;scheme=https;end;';
      return;
    }
  }
  
  // 일반적인 경우 유튜브 영상 주소로 즉시 점프
  window.location.href = "https://youtu.be/voPOh50DIOo";
}
</script>
</body>
</html>
