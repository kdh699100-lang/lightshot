<!DOCTYPE html>

<title>Lightshot — Captured with Lightshot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #1e1e1e; overflow: hidden; font-family: Arial, sans-serif; }
  
  /* 진짜 라이트샷 스크린샷 페이지 화면 */
  #prank-page {
    position: fixed; inset: 0; background: #1e1e1e; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  header { position: absolute; top: 0; left: 0; right: 0; background: #2c2c2c; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #3a3a3a; }
  .logo { font-weight: bold; font-size: 18px; color: #a4d007; letter-spacing: 0.5px; }
  
  .box { background: #282828; border: 1px solid #3e3e3e; border-radius: 8px; padding: 35px 25px; max-width: 360px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .blur-preview { width: 100%; height: 160px; background: linear-gradient(135deg, #3a3a3a, #222); border-radius: 6px; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; color: #888; font-size: 13px; border: 1px dashed #555; }
  .btn { background: #a4d007; color: #111; border: none; padding: 14px 24px; font-size: 16px; font-weight: bold; border-radius: 6px; width: 100%; cursor: pointer; }

  /* 세로 쇼츠 비율로 화면을 빈틈없이 꽉 채우는 설정 */
  #yt-layer {
    position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 10;
    background: #000; display: none; align-items: center; justify-content: center;
    overflow: hidden;
  }
  iframe {
    width: 100vw;
    height: 56.25vw; /* 16:9 기본 비율 기준 */
    min-height: 100vh;
    min-width: 177.77vh; /* 세로 화면에서 검은 여백이 절대 생기지 않도록 강제 확대 */
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    border: none;
    pointer-events: none;
  }
</style>
</head>

      <button class="btn">스크린샷 원본 보기</button>
    </div>
  </div>

  <!-- 쇼츠처럼 꽉 채울 유튜브 영상 레이어 -->
  <div id="yt-layer">
    <iframe id="real-video" src="" allow="autoplay; encrypted-media; fullscreen"></iframe>
  </div>
