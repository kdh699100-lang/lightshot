<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lightshot — Captured with Lightshot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  #scare { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; }
  #scare svg { width: 100%; height: 100%; object-fit: cover; animation: shake 0.08s infinite; }
  @keyframes shake {
    0% { transform: translate(0, 0) scale(1.05); }
    25% { transform: translate(-15px, 12px) scale(1.12); }
    50% { transform: translate(15px, -12px) scale(1.08); }
    75% { transform: translate(-12px, -15px) scale(1.15); }
    100% { transform: translate(12px, 15px) scale(1.1); }
  }
</style>
</head>
<body onclick="playScream()" ontouchstart="playScream()">
  <div id="scare">
    <svg viewBox="0 0 400 600" preserveAspectRatio="xMidYMid slice">
      <rect width="400" height="600" fill="#000"/>
      <ellipse cx="200" cy="290" rx="145" ry="200" fill="#dcdcdc"/>
      <ellipse cx="200" cy="290" rx="135" ry="190" fill="#f2f2f2"/>
      <!-- 눈구멍 -->
      <ellipse cx="140" cy="230" rx="38" ry="45" fill="#050505"/>
      <ellipse cx="260" cy="230" rx="38" ry="45" fill="#050505"/>
      <circle cx="140" cy="230" r="6" fill="#ff0000"/>
      <circle cx="260" cy="230" r="6" fill="#ff0000"/>
      <!-- 코 -->
      <path d="M190 290 L200 265 L210 290 Z" fill="#111"/>
      <!-- 찢어진 입 -->
      <ellipse cx="200" cy="395" rx="68" ry="88" fill="#080000"/>
      <path d="M140 365 L155 390 L170 360 L185 395 L200 358 L215 395 L230 360 L245 390 L260 365" fill="none" stroke="#ccc" stroke-width="5"/>
      <path d="M145 430 L165 405 L185 435 L200 402 L215 435 L235 405 L255 430" fill="none" stroke="#ccc" stroke-width="5"/>
      <!-- 핏줄 -->
      <path d="M80 180 Q110 210 105 250 M320 180 Q290 210 295 250 M150 110 Q180 150 170 180" stroke="#700" stroke-width="3" fill="none"/>
    </svg>
  </div>

<script>
let played = false;
function playScream() {
  if (played) return;
  played = true;
  if (navigator.vibrate) navigator.vibrate([500, 100, 500, 100, 800]);
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc1 = ctx.createOscillator();
    const osc2 = ctx.createOscillator();
    const gain = ctx.createGain();
    osc1.type = 'sawtooth';
    osc2.type = 'square';
    osc1.frequency.setValueAtTime(950, ctx.currentTime);
    osc1.frequency.exponentialRampToValueAtTime(2800, ctx.currentTime + 0.15);
    osc1.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 1.5);
    osc2.frequency.setValueAtTime(1100, ctx.currentTime);
    osc2.frequency.linearRampToValueAtTime(3200, ctx.currentTime + 0.2);
    gain.gain.setValueAtTime(1.0, ctx.currentTime);
    osc1.connect(gain);
    osc2.connect(gain);
    gain.connect(ctx.destination);
    osc1.start();
    osc2.start();
  } catch (e) {}
}
window.onload = playScream;
</script>
</body>
</html>
